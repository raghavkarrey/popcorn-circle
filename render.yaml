services:
  - type: web
    name: popcorn-circle
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GROUP_FILE
        value: /data/circles.json
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: circles
      mountPath: /data
      sizeGB: 1
